name: Build Android APK
# Manual only: Actions > Build Android APK > Run workflow.
# Builds the public arm64-v8a APK the same way docs/android.md describes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          
          sudo find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name 28.2.13676358 -exec rm -rf {} + || true
          ls "$ANDROID_HOME/ndk"

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Gradle 8.14
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.14/bin/gradle" --version

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .local/android/debug.keystore
          key: horizon-signing-key-v1

      - name: Prepare engine tables (downloads Minecraft from Mojang)
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: python3 tools/android_prepare.py

      - name: Build APK (arm64-v8a)
        run: >
          python3 tools/android_build.py --abi arm64-v8a --public --profile fast
          --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
          --gradle "$RUNNER_TEMP/gradle-8.14/bin/gradle"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64
          path: .local/android/apk/arm64-v8a/horizon-android-public.apk
          if-no-files-found: error
          retention-days: 14
          
